<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Template Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Template Customization</p>
            </div>
            
            <nav id="nav-links">
                <!-- injected by JS -->
            </nav>
            
            <div class="sidebar-actions">
                <button id="btn-reset" class="btn btn-outline btn-danger">♻️ Reset to Default</button>
                <button id="btn-export" class="btn btn-outline">⬇️ Export Config JSON</button>
                <div class="file-btn-wrapper">
                  <button class="btn btn-outline" style="pointer-events:none;">⬆️ Import Config JSON</button>
                  <input type="file" id="btn-import" accept=".json">
                </div>
            </div>
        </aside>
        
        <main class="content">
            <header class="content-header">
                <div class="header-left">
                    <h1>Landing Page Admin Panel</h1>
                    <p>Customize your high-converting template</p>
                </div>
                
                <div class="header-right">
                    <div id="save-status" class="status-badge saved">
                        <span class="status-dot"></span> 
                        <span class="status-text">Saved</span>
                    </div>
                    
                    <div class="header-actions">
                        <button id="btn-save" class="btn btn-primary">💾 Save Changes</button>
                        <a href="/index.html" class="btn btn-outline" target="_blank">👁️ Preview (BR)</a>
                        <a href="/index-en.html" class="btn btn-outline" target="_blank">👁️ Preview (EN)</a>
                    </div>
                </div>
            </header>
            
            <div class="content-body">
                <form id="admin-form">
                    <!-- injected by js -->
                </form>
            </div>
        </main>
    </div>
    
    <div id="toast" class="toast">
        <div class="toast-icon">✅</div>
        <div class="toast-content">
            <strong>Changes saved successfully</strong>
            <span id="toast-desc">Your template has been updated securely.</span>
        </div>
    </div>
    
    <script type="module" src="/admin.js"></script>
</body>
</html>
